services:
  - type: web
    name: ligtas-backend
    runtime: node
    plan: free
    branch: balagtas-monitoring
    # Render may set NODE_ENV=production during install; TypeScript declarations
    # are required at build time even though they are not runtime dependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: ligtas-d7a4c
      - key: ENABLE_NOTIFICATION_WORKERS
        # Firestore event listeners handle new alerts immediately; a bounded five-minute sweep only retries/receipts due deliveries.
        value: "true"
      - key: FIREBASE_WEB_API_KEY
        sync: false
